name: Release

# Runs when a version tag is pushed, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create GitHub release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes

  build-windows:
    name: Build Windows executable
    needs: create-release
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4.1"

      - name: Install dependencies
        run: opam install . --deps-only --yes

      - name: Build
        run: opam exec -- dune build --profile release bin/main.exe

      - name: Upload executable to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          asset="balatro-${TAG}-windows.exe"
          cp _build/default/bin/main.exe "$asset"
          gh release upload "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" --clobber
