name: Release

# Runs when a version tag is pushed, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
#
# It can also be started by hand for a tag that already exists (Actions tab →
# Release → "Run workflow"), e.g. to add new executables to an old release:
#   gh workflow run release.yml -f tag=v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v0.1.0)"
        required: true
        type: string

# The tag being released: the input when started by hand, otherwise the
# pushed tag.
env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create GitHub release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        # Skip creation if the release already exists (e.g. it was created
        # from the GitHub web UI, which also pushes the tag).
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes
          fi

  build:
    # One job per operating system. The matrix below makes GitHub run the
    # same steps three times, each time with a different value of
    # `matrix.os` (the runner) and `matrix.suffix` (the asset name ending).
    name: Build ${{ matrix.name }} executable
    needs: create-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      # Keep building the other systems even if one of them fails.
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            suffix: windows.exe
          - name: Linux
            os: ubuntu-latest
            suffix: linux-x86_64
          - name: macOS
            os: macos-latest
            suffix: macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Build the code at the tag, even when the workflow was started by
          # hand from main.
          ref: ${{ env.TAG }}

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4.1"

      # Same idea as in ci.yml: keep the installed opam packages between
      # runs, so only the first release after a dependency change pays for
      # installing them (several minutes on Windows).
      - name: Cache opam packages
        uses: actions/cache@v5
        with:
          path: _opam
          key: opam-release-${{ runner.os }}-5.4.1-${{ hashFiles('*.opam') }}

      - name: Install dependencies
        run: opam install . --deps-only --yes

      - name: Build
        run: opam exec -- dune build --profile release bin/main.exe

      - name: Upload executable to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SUFFIX: ${{ matrix.suffix }}
        # dune names the binary main.exe on every system; the extension only
        # matters on Windows, so the Linux/macOS assets drop it.
        run: |
          asset="balatro-${TAG}-${SUFFIX}"
          cp _build/default/bin/main.exe "$asset"
          gh release upload "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" --clobber
