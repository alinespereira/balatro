name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4.1"

      # setup-ocaml already caches the compiler, but not the packages we
      # install on top of it. Caching the local switch (_opam) saves ~1.5 min:
      # on a hit, the two opam install steps below find everything already
      # installed and finish in seconds. The key changes whenever the .opam
      # file (our dependency list) or the ocamlformat version changes, which
      # makes the next run rebuild the cache.
      - name: Cache opam packages
        uses: actions/cache@v4
        with:
          path: _opam
          key: opam-ci-${{ runner.os }}-5.4.1-ocamlformat-0.29.0-${{ hashFiles('*.opam') }}

      - name: Install dependencies
        run: opam install . --deps-only --with-test --yes

      - name: Install ocamlformat
        run: opam install ocamlformat.0.29.0 --yes

      - name: Check formatting
        run: opam exec -- dune build @fmt

      - name: Build
        run: opam exec -- dune build @all

      - name: Run tests
        run: opam exec -- dune runtest --force
